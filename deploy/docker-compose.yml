# Derived stores only (architecture-v2.md §8). Both containers are intentionally
# NON-persistent: no volumes. The hot JSON store owns all content; rehydration
# rebuilds these from scratch at any time (§5).
services:
  opensearch:
    build: ./opensearch
    container_name: dj-memory-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    container_name: dj-memory-neo4j
    environment:
      # Fixed local-only auth; server binds 127.0.0.1 and holds no secrets.
      - NEO4J_AUTH=neo4j/djmemory-local
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p djmemory-local 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
