  <path d="M 52 184 L 74 184" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 52 225 L 74 225" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

