  <text x="910" y="188.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">UI /swagger/index.html · 스펙 /swagger/doc.json</text>

