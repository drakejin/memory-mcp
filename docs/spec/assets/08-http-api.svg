  <rect x="86" y="141" width="58" height="18" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="115" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#4f46e5" text-anchor="middle">GET</text>
  <text x="156" y="154.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#0f172a">/healthz</text>
  <text x="910" y="154.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">liveness · data.status = ok</text>
