<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="t d">
  <title id="t">memory-mcp HTTP 라우트 트리</title>
  <desc id="d">chi.NewRouter 아래 /healthz, /swagger/*, /v1 서브라우터가 놓이고, /v1 안에 운영·전역 문서 라우트와 프로젝트 스코프 서브라우터가 중첩된 계층. HTTP 메서드 배지는 episodic, knowledge, documents, ops 그룹 색으로 구분된다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="900" fill="#fbfcfe" rx="14"/>

  <!-- header -->
  <text x="36" y="40" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">HTTP API — go-chi 라우트 트리</text>
  <text x="36" y="60" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">모든 JSON 응답은 {success, data, error} 봉투 · swaggo 주석이 docs/swagger.json 을 생성한다</text>

  <!-- root router -->
  <rect x="36" y="80" width="888" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="56" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">chi.NewRouter()</text>
  <text x="908" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748b" text-anchor="end">internal/server/server.go · Router()</text>
  <text x="56" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">미들웨어 없음 · 인증 없음 · 등록되지 않은 경로는 chi 기본 404(text/plain)</text>

