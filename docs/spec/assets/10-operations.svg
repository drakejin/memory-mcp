<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 614" width="960" role="img" aria-labelledby="t d">
  <title id="t">memory-mcp 로컬 운영 구성</title>
  <desc id="d">호스트에서 실행되는 memory-mcp 서버가 127.0.0.1:8420에 바인딩되고, docker compose가 띄운 볼륨 없는 OpenSearch(9200)와 Neo4j(7687/7474) 컨테이너에 접속하며, 로컬 머신 밖의 S3 버킷 vms-memory-mcp(ap-northeast-2)로 아카이브를 내보낸다.</desc>

  <rect width="960" height="614" fill="#fbfcfe" rx="14"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="24" y="34" font-size="15" font-weight="600" fill="#0f172a">운영 구성 — 호스트 프로세스 1개 + 파생 컨테이너 2개 + 외부 S3</text>
    <text x="24" y="56" font-size="11.5" fill="#64748b">make start = compose up --build → healthcheck 폴링 → go run. 컨테이너는 볼륨이 없어 재기동마다 비어 있고, 정본은 호스트 디스크에만 있다.</text>

    <!-- host boundary -->
    <rect x="24" y="76" width="912" height="404" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="40" y="100" font-size="11.5" fill="#64748b">로컬 머신 (host) — 리스너는 전부 127.0.0.1, 인증 없음</text>

    <!-- caller -->
    <rect x="44" y="118" width="236" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="58" y="144" font-size="15" font-weight="600" fill="#0f172a">호출자 — 에이전트 / curl</text>
    <text x="58" y="166" font-size="11.5" fill="#64748b">외부 바인딩 금지 (config.Validate)</text>

    <line x1="162" y1="180" x2="162" y2="204" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="172" y="197" font-size="11.5" fill="#64748b">HTTP :8420</text>

    <!-- server -->
    <rect x="44" y="206" width="236" height="124" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="58" y="232" font-size="15" font-weight="600" fill="#0f172a">memory-mcp 서버</text>
    <text x="58" y="254" font-size="13" fill="#0f172a">go run ./cmd/memory-mcp</text>
    <text x="58" y="274" font-size="13" fill="#0f172a">listen 127.0.0.1:8420</text>
    <text x="58" y="294" font-size="13" fill="#0f172a">/healthz · /v1/… · /swagger</text>
    <text x="58" y="316" font-size="11.5" fill="#64748b">도커 아님 — 호스트에서 포그라운드 실행</text>

    <line x1="162" y1="330" x2="162" y2="354" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- hot store -->
    <rect x="44" y="356" width="236" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="58" y="382" font-size="15" font-weight="600" fill="#0f172a">hot 정본 — 로컬 디스크</text>
    <text x="58" y="404" font-size="13" fill="#0f172a">~/.local/dj-memory/</text>
    <text x="58" y="424" font-size="13" fill="#0f172a">episodic · knowledge · blobs</text>
    <text x="58" y="443" font-size="11.5" fill="#64748b">manifest.json · dir 0700 / file 0600</text>

    <!-- docker boundary -->
    <rect x="356" y="110" width="284" height="344" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="370" y="132" font-size="11.5" fill="#64748b">docker compose -f deploy/docker-compose.yml</text>

    <!-- opensearch -->
    <rect x="372" y="146" width="252" height="140" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="386" y="172" font-size="15" font-weight="600" fill="#0f172a">dj-memory-opensearch</text>
    <text x="386" y="194" font-size="13" fill="#0f172a">opensearch:2.19.1 + nori</text>
    <text x="386" y="214" font-size="13" fill="#0f172a">127.0.0.1:9200 → 9200</text>
    <text x="386" y="234" font-size="13" fill="#0f172a">health: cluster ≥ yellow</text>
    <text x="386" y="256" font-size="11.5" fill="#64748b">5s × 30회, start_period 20s</text>
    <text x="386" y="274" font-size="11.5" fill="#64748b">volumes 없음 → 재기동 시 0건</text>

    <!-- neo4j -->
    <rect x="372" y="300" width="252" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="386" y="326" font-size="15" font-weight="600" fill="#0f172a">dj-memory-neo4j</text>
    <text x="386" y="348" font-size="13" fill="#0f172a">neo4j:5-community</text>
    <text x="386" y="368" font-size="13" fill="#0f172a">7687 bolt · 7474 HTTP</text>
    <text x="386" y="388" font-size="13" fill="#0f172a">health: cypher-shell RETURN 1</text>
    <text x="386" y="410" font-size="11.5" fill="#64748b">5s × 30회, start_period 20s</text>
    <text x="386" y="428" font-size="11.5" fill="#64748b">volumes 없음 → 재기동 시 0개</text>

    <!-- server to containers -->
    <line x1="282" y1="236" x2="370" y2="236" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="288" y="228" font-size="11.5" fill="#64748b">HTTP :9200</text>

    <line x1="282" y1="312" x2="370" y2="312" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="288" y="304" font-size="11.5" fill="#64748b">bolt :7687</text>

    <text x="356" y="468" font-size="11.5" fill="#64748b">make infra-wait — docker inspect Health.Status 이 healthy 될 때까지 3s × 60회 폴링</text>

    <!-- outbound to S3 -->
    <line x1="162" y1="452" x2="162" y2="514" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="172" y="492" font-size="11.5" fill="#64748b">아카이브 · 스냅샷 · blob</text>
    <text x="172" y="509" font-size="11.5" fill="#64748b">outbound HTTPS (aws-sdk-go-v2)</text>

    <rect x="44" y="516" width="340" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="58" y="542" font-size="15" font-weight="600" fill="#0f172a">cold — Amazon S3 (머신 외부)</text>
    <text x="58" y="563" font-size="13" fill="#0f172a">s3://vms-memory-mcp · ap-northeast-2</text>
    <text x="58" y="581" font-size="11.5" fill="#64748b">profile vms-holdings · versioning on · public 차단</text>

    <!-- legend -->
    <rect x="420" y="510" width="516" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="438" y="528" font-size="11.5" fill="#64748b">범례</text>

    <rect x="438" y="538" width="12" height="12" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="456" y="548" font-size="11.5" fill="#0f172a">hot 정본 · 서버</text>
    <rect x="556" y="538" width="12" height="12" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="574" y="548" font-size="11.5" fill="#0f172a">episodic (OpenSearch)</text>
    <rect x="712" y="538" width="12" height="12" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="730" y="548" font-size="11.5" fill="#0f172a">knowledge (Neo4j)</text>
    <rect x="846" y="538" width="12" height="12" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="864" y="548" font-size="11.5" fill="#0f172a">cold (S3)</text>

    <line x1="438" y1="572" x2="470" y2="572" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="478" y="576" font-size="11.5" fill="#0f172a">정본 쓰기</text>
    <line x1="556" y1="572" x2="588" y2="572" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="596" y="576" font-size="11.5" fill="#0f172a">파생 upsert — 실패해도 hot 쓰기는 성공</text>

  </g>
</svg>
