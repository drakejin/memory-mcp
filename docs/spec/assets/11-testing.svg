<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 644" width="960" role="img" aria-labelledby="t d">
  <title id="t">memory-mcp 검증 피라미드 — fake / 실컨테이너+실버킷 / 실 서버 프로세스</title>
  <desc id="d">아래층은 fake만 주입해 컨테이너 없이 도는 단위 테스트, 가운데는 DJ_MEMORY_LIVE_TEST=1 하나로 옵트인해 실제 OpenSearch·Neo4j 컨테이너와 실제 S3 버킷을 상대하는 라이브 계약 테스트, 맨 위는 docker compose 컨테이너와 실제 S3 버킷, 실제 서버 서브프로세스를 상대로 도는 블랙박스 수용 8단계다. 완료 판정 권한은 맨 위 층에만 있다.</desc>

  <rect width="960" height="644" fill="#fbfcfe" rx="14"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="24" y="34" font-size="15" font-weight="600" fill="#0f172a">검증 계층 — 무엇이 fake이고 무엇이 실물인가</text>
    <text x="24" y="58" font-size="11.5" fill="#64748b">아래로 갈수록 빠르고 결정적이며, 위로 갈수록 실물이 하나씩 늘어난다. 완료 판정 권한은 맨 위 층에만 있다.</text>

    <!-- ============ tier 3: blackbox acceptance ============ -->
    <rect x="110" y="96" width="300" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="126" y="124" font-size="15" font-weight="600" fill="#0f172a">블랙박스 수용 8단계</text>
    <text x="126" y="148" font-size="13" fill="#0f172a">test/blackbox · -tags blackbox</text>
    <text x="126" y="170" font-size="13" fill="#0f172a">make blackbox</text>
    <text x="126" y="192" font-size="11.5" fill="#64748b">TestScenario01…08, 선언 순서 고정</text>
    <text x="126" y="208" font-size="11.5" fill="#64748b">앞 단계 실패 시 뒤 단계는 전제 미달</text>

    <line x1="260" y1="238" x2="260" y2="220" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="274" y="234" font-size="11.5" fill="#64748b">서버 프로세스가 더해진다</text>

    <!-- ============ tier 2: live contract ============ -->
    <rect x="70" y="240" width="380" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="86" y="268" font-size="15" font-weight="600" fill="#0f172a">라이브 계약 테스트 — 옵트인</text>
    <text x="86" y="292" font-size="13" fill="#0f172a">게이트 하나: DJ_MEMORY_LIVE_TEST=1</text>
    <text x="86" y="312" font-size="13" fill="#0f172a">make live — search · graph · cold</text>
    <text x="86" y="332" font-size="11.5" fill="#64748b">미설정이면 t.Skip — 기본 실행에서 9건 skip</text>

    <line x1="260" y1="374" x2="260" y2="356" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="274" y="370" font-size="11.5" fill="#64748b">통과해도 판정은 위층에서</text>

    <!-- ============ tier 1: unit ============ -->
    <rect x="30" y="376" width="460" height="132" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="46" y="404" font-size="15" font-weight="600" fill="#0f172a">단위 테스트 — fake 주입, 컨테이너 0</text>
    <text x="46" y="428" font-size="13" fill="#0f172a">internal/**/*_test.go — 370 함수 · 747 서브테스트</text>
    <text x="46" y="450" font-size="13" fill="#0f172a">make test = vet -tags blackbox + go test -race ./...</text>
    <text x="46" y="472" font-size="11.5" fill="#64748b">table-driven + t.Run, testify 금지(stdlib만), -race 통과</text>
    <text x="46" y="492" font-size="11.5" fill="#64748b">fakeStore · fakeIndex · fakeGraph · fakeTransport · fakeRunner · fakeObjects</text>

    <!-- ============ right column: what is real ============ -->

    <rect x="520" y="96" width="416" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="536" y="120" font-size="13" fill="#0f172a">실물 전부 — 컨테이너 · 버킷 · 서버 프로세스</text>
    <rect x="536" y="130" width="176" height="28" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="550" y="148" font-size="11.5" fill="#0f172a">OpenSearch + nori :9200</text>
    <rect x="724" y="130" width="152" height="28" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="738" y="148" font-size="11.5" fill="#0f172a">Neo4j 5 · bolt :7687</text>
    <rect x="536" y="164" width="210" height="28" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="550" y="182" font-size="11.5" fill="#0f172a">S3 vms-memory-mcp (실버킷)</text>
    <rect x="758" y="164" width="172" height="28" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="772" y="182" font-size="11.5" fill="#0f172a">컨테이너 파괴 단계 포함</text>
    <text x="536" y="208" font-size="11.5" fill="#64748b">jin/blackbox-test/ 프리픽스 · 실행 전후 자동 정리</text>

    <rect x="520" y="240" width="416" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="536" y="264" font-size="13" fill="#0f172a">컨테이너 · 실버킷은 실물, 서버 프로세스는 없다</text>
    <text x="536" y="286" font-size="13" fill="#0f172a">search · graph · cold / live_test.go</text>
    <text x="536" y="308" font-size="11.5" fill="#64748b">scratch 인덱스 / 유니크 프로젝트 / jin/livetest 프리픽스로 격리 후 삭제</text>
    <text x="536" y="328" font-size="11.5" fill="#64748b">make test에 포함되지 않는다 — make live로 도는 계약 검증</text>

    <rect x="520" y="376" width="416" height="132" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="536" y="400" font-size="13" fill="#0f172a">실물 없음 — 프로세스 안에서 끝난다</text>
    <text x="536" y="422" font-size="13" fill="#0f172a">fake는 프로덕션과 동일한 인터페이스 구현</text>
    <text x="536" y="444" font-size="13" fill="#0f172a">t.TempDir()만 실제 디스크 (hotstore · blob · cmd)</text>
    <text x="536" y="468" font-size="11.5" fill="#64748b">100% episodic · errs · apierr · ulid — 합산 93.9%</text>
    <text x="536" y="488" font-size="11.5" fill="#64748b">0% 함수 넷뿐: main · boltRunner.Verify/Run · ListenAndServe</text>

    <!-- ============ verdict band ============ -->
    <rect x="24" y="524" width="584" height="72" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="42" y="552" font-size="15" font-weight="600" fill="#0f172a">완료 판정 — 저장돼야 할 것이 실제로 다 있는가</text>
    <text x="42" y="576" font-size="11.5" fill="#64748b">단위 테스트가 전부 초록이어도 완료가 아니다. 8단계가 전부 초록일 때 완료다.</text>

    <rect x="624" y="524" width="312" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="642" y="550" font-size="15" font-weight="600" fill="#0f172a">파괴도 검증의 일부</text>
    <text x="642" y="572" font-size="11.5" fill="#0f172a">5: compose down -v/up · 7: docker stop</text>
    <text x="642" y="588" font-size="11.5" fill="#64748b">다시 세워 같은 답이 나와야 통과</text>

    <!-- ============ legend ============ -->
    <rect x="24" y="608" width="12" height="12" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="42" y="618" font-size="11.5" fill="#64748b">수용 판정 · 정본</text>
    <rect x="150" y="608" width="12" height="12" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="168" y="618" font-size="11.5" fill="#64748b">OpenSearch</text>
    <rect x="242" y="608" width="12" height="12" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="260" y="618" font-size="11.5" fill="#64748b">Neo4j</text>
    <rect x="305" y="608" width="12" height="12" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="323" y="618" font-size="11.5" fill="#64748b">fake · S3 cold</text>
    <rect x="420" y="608" width="12" height="12" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="438" y="618" font-size="11.5" fill="#64748b">파괴 단계</text>

  </g>
</svg>
